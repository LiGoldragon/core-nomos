[package]
name         = "core-nomos"
version      = "0.6.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/core-nomos"
description  = "The stringless encoded form of Nomos: macros as typed data transforming the Ethos encoded form into the Logos encoded form. Two macro kinds (named + structural), a stateful-at-rest content-identified MacroPackage, and a closed template escape algebra (Realize / Splice / Invoke). TextualNomos remains deferred."
publish      = false

[lib]
name = "core_nomos"
path = "src/lib.rs"

[dependencies]
content-identity         = { git = "https://github.com/LiGoldragon/content-identity.git", rev = "24b43bae5d9748b0e7f679c6ec9f85a643c4d36a" }
capsule-content-identity = { package = "content-identity", git = "https://github.com/LiGoldragon/content-identity.git", rev = "f1f9c6efc828acaefd0f751550cd40389d312bf5" }
name-table               = { git = "https://github.com/LiGoldragon/name-table.git", rev = "196610e2907687dcb8dbd0d2dfaafe4aefd9fa27" }
protos                   = { git = "https://github.com/LiGoldragon/protos.git", rev = "1435c9aeb7f24e811aca670101e355ff26818ae2" }
core-ethos               = { git = "https://github.com/LiGoldragon/core-ethos.git", rev = "b9db643a853b1f52f10a4100a791d5dbc8c7240d" }
core-logos               = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "ffb9ccdeac94b4e3401fc4bffa593589f0321fe5" }
slice-core-ethos         = { package = "core-ethos", git = "https://github.com/LiGoldragon/core-ethos.git", rev = "5bace8ae21468401a07af262b6b9c15dd8543cb6" }
slice-core-logos         = { package = "core-logos", git = "https://github.com/LiGoldragon/core-logos.git", rev = "a7dd1e2b8d0c55d26e96c5b1b7154a534cf03e55" }
textual-rust             = { git = "https://github.com/LiGoldragon/textual-rust.git", rev = "87a9d9c29403e5ff2e08f4d18d034b11cc30be1b" }
structural-codec         = { git = "https://github.com/LiGoldragon/structural-codec.git", rev = "23497c43f81b619158e5cfbd83a012eb63c4186f" }
rkyv                     = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror                = "2"

[dev-dependencies]
encoded-name-table     = { package = "name-table", git = "https://github.com/LiGoldragon/name-table.git", rev = "1f558eac44bd03034e51ad98e3a65ec16d8b8411" }
signal-sema-translator = { git = "https://github.com/LiGoldragon/signal-sema-translator.git", rev = "8ff7d0db033c756a0cd7999e72e564ca1c32b4aa" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
