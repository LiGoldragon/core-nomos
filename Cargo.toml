[package]
name         = "core-nomos"
version      = "0.41.1"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/core-nomos"
description  = "Strict authority-sealed bootstrap Ethos lowering into Logos."
publish      = false
autotests    = false

[lib]
name = "core_nomos"
path = "src/lib.rs"

[dependencies]
capsule-content-identity = { package = "content-identity", git = "https://github.com/LiGoldragon/content-identity.git", rev = "896b21e17f31b66d0802bff899b4b60acea9c0f1" }
core-ethos               = { git = "https://github.com/LiGoldragon/core-ethos.git", rev = "43b48c779c54ee9f05cbcc111d5d88074b162461" }
core-logos               = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "734363bd5fca01c7dab46028f4a36e3ce6ae6650" }
signal-sema-translator   = { git = "https://github.com/LiGoldragon/signal-sema-translator.git", rev = "3f41813dd63904c7e2b3da4382eff64ed1bf12fe" }
thiserror                = "2"

[dev-dependencies]
encoded-name-table = { package = "name-table", git = "https://github.com/LiGoldragon/name-table.git", rev = "a22f48d8040ab9235f3552ad8654ff8e27b8157d" }

[[test]]
name = "bootstrap"
path = "tests/bootstrap.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
