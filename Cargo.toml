[package]
name         = "core-nomos"
version      = "0.11.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/core-nomos"
description  = "The stringless encoded form of Nomos: authored transformer declarations retain complete encoded-ID chains before atomic sealing into the legacy execution package."
publish      = false

[lib]
name = "core_nomos"
path = "src/lib.rs"

[dependencies]
content-identity         = { git = "https://github.com/LiGoldragon/content-identity.git", rev = "24b43bae5d9748b0e7f679c6ec9f85a643c4d36a" }
capsule-content-identity = { package = "content-identity", git = "https://github.com/LiGoldragon/content-identity.git", rev = "fdf2db1d5a9e8ea52d24d39a03833c3e6885c355" }
name-table               = { git = "https://github.com/LiGoldragon/name-table.git", rev = "196610e2907687dcb8dbd0d2dfaafe4aefd9fa27" }
protos                   = { git = "https://github.com/LiGoldragon/protos.git", rev = "1343d0c405cdb6929552ea6b12c48739e73f35ab" }
core-ethos               = { git = "https://github.com/LiGoldragon/core-ethos.git", rev = "b9db643a853b1f52f10a4100a791d5dbc8c7240d" }
core-logos               = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "ffb9ccdeac94b4e3401fc4bffa593589f0321fe5" }
slice-core-ethos         = { package = "core-ethos", git = "https://github.com/LiGoldragon/core-ethos.git", rev = "bbeca83c6980cc8a415f46fffc6e403fedf10b6b" }
slice-core-logos         = { package = "core-logos", git = "https://github.com/LiGoldragon/core-logos.git", rev = "997e1595601be851ad14617384302e3ee61a658f" }
signal-sema-translator   = { git = "https://github.com/LiGoldragon/signal-sema-translator.git", rev = "8c504ba7aa8dbdc5edf7daadbb862bbdaa5613be" }
textual-rust             = { git = "https://github.com/LiGoldragon/textual-rust.git", rev = "87a9d9c29403e5ff2e08f4d18d034b11cc30be1b" }
structural-codec         = { git = "https://github.com/LiGoldragon/structural-codec.git", rev = "23497c43f81b619158e5cfbd83a012eb63c4186f" }
rkyv                     = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror                = "2"

[dev-dependencies]
encoded-name-table = { package = "name-table", git = "https://github.com/LiGoldragon/name-table.git", rev = "50cb4bb53ae2dc4f2516f6912be328ef98ae49f8" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
