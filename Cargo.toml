[package]
name         = "core-nomos"
version      = "0.41.1"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/core-nomos"
description  = "Strict authority-sealed bootstrap Ethos lowering into Logos."
publish      = false
autotests    = false

[lib]
name = "core_nomos"
path = "src/lib.rs"

[dependencies]
capsule-content-identity = { package = "content-identity", git = "https://github.com/LiGoldragon/content-identity.git", rev = "896b21e17f31b66d0802bff899b4b60acea9c0f1" }
core-ethos               = { git = "https://github.com/LiGoldragon/core-ethos.git", rev = "581c833" }
core-logos               = { git = "https://github.com/LiGoldragon/core-logos.git", rev = "b9bf013f6013" }
name-table               = { git = "https://github.com/LiGoldragon/name-table.git", rev = "7dd5db15c16b4246c83d049c759415d3252a7d43" }
thiserror                = "2"


[[test]]
name = "bootstrap"
path = "tests/bootstrap.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
